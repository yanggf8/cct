name: Cache-Hit Response Contract

# Every cache-hit route must return the object it stored, under `data`.
#
# 387f62a moved all five cache-hit sites to `ApiResponseFactory.cached(cached.data, …)`
# in one sweep. Four of them hold the raw `CacheAwareResult`, so `.data` was right.
# The pre-market site had already unwrapped, so `.data` was `undefined` — and
# `JSON.stringify` drops undefined fields, so that route answered 200 with
# `success: true` and no `data` key for the full TTL, from 2026-08-04 to 08-06.
#
# Nothing caught it: 200, `success: true`, healthy cache, real data in D1 the
# whole time. There was no test over these routes and no CI home for one, which
# is the gap this file closes — the same reason `d1-sql` was adopted into
# validate-no-artifacts.yml.
#
# The guard is stated over all five sites deliberately: the identical sweep is
# as likely to run the other way, and "fixing" the raw sites to match pre-market
# would reopen exactly what 387f62a closed.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/routes/**'
      - 'src/modules/simplified-enhanced-dal.ts'
      - 'src/modules/api-v1-responses.ts'
      - 'src/modules/cache-do.ts'
      # The writers. They decide the SHAPE that lands in the cache, and the
      # contract is a statement about that shape — a writer that started
      # nesting under `.data`, or dropped `all_signals`, would break the
      # reader without touching a single file listed above.
      - 'src/modules/pre-market-data-bridge.ts'
      - 'src/modules/scheduler.ts'
      # The Durable Object itself, and the factory that builds the keys the
      # readers look up. Both can break a hit without any route changing.
      - 'src/modules/cache-durable-object.ts'
      - 'src/modules/kv-key-factory.ts'
      # Without this, deleting the npm script silently disarms the whole job.
      - 'package.json'
      - 'tests/validation/**'
      - '.github/workflows/cache-hit-contract.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'src/routes/**'
      - 'src/modules/simplified-enhanced-dal.ts'
      - 'src/modules/api-v1-responses.ts'
      - 'src/modules/cache-do.ts'
      # The writers. They decide the SHAPE that lands in the cache, and the
      # contract is a statement about that shape — a writer that started
      # nesting under `.data`, or dropped `all_signals`, would break the
      # reader without touching a single file listed above.
      - 'src/modules/pre-market-data-bridge.ts'
      - 'src/modules/scheduler.ts'
      # The Durable Object itself, and the factory that builds the keys the
      # readers look up. Both can break a hit without any route changing.
      - 'src/modules/cache-durable-object.ts'
      - 'src/modules/kv-key-factory.ts'
      # Without this, deleting the npm script silently disarms the whole job.
      - 'package.json'
      - 'tests/validation/**'
      - '.github/workflows/cache-hit-contract.yml'

jobs:
  cache-hit-contract:
    name: Cache-Hit Response Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache-hit response contract
        # Drives the real dispatchers against a stubbed Durable Object and
        # asserts on the serialized wire response — the only place the defect
        # was ever visible. Bundles with esbuild into the OS temp dir, so the
        # no-artifacts policy is unaffected.
        run: npm run test:cache-hit-contract

      - name: DO cache kill switch
        # Same class of guard, previously with no CI home either.
        run: npm run test:do-cache-flag
