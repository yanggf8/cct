name: Trading System Automated Analysis

# 5-Tier Intelligent Analysis System
# FEATURES: Scheduled analysis runs, Teams notifications, health monitoring
# MIGRATION BENEFITS: Unlimited schedules, 100% FREE, better observability, AI-powered insights
# SCHEDULES: All times in UTC to match original Cloudflare cron schedule

on:
  schedule:
    # Pre-Market Briefing - 8:30 AM ET (12:30 PM UTC)
    - cron: '30 12 * * 1-5'  # Monday-Friday at 12:30 UTC
    # Intraday Performance Check - 12:00 PM ET (4:00 PM UTC)
    - cron: '0 16 * * 1-5'   # Monday-Friday at 16:00 UTC
    # End-of-Day Summary - 4:05 PM ET (8:05 PM UTC)
    - cron: '5 20 * * 1-5'   # Monday-Friday at 20:05 UTC
    # Weekly Review - 10:00 AM ET Sunday (2:00 PM UTC)
    - cron: '0 14 * * SUN'   # Sunday at 14:00 UTC

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  trading-analysis:
    name: Execute Trading Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Determine Analysis Type
        id: analysis-type
        run: |
          # Match on the exact cron expression that triggered this run.
          # This is deterministic and immune to GitHub Actions execution delays
          # (the old time-window approach failed when jobs ran late).
          SCHEDULE="${{ github.event.schedule }}"
          echo "Schedule trigger: '${SCHEDULE:-workflow_dispatch}'"
          echo "Current UTC time: $(date -u +'%Y-%m-%d %H:%M:%S')"

          case "$SCHEDULE" in
            '30 12 * * 1-5')
              ANALYSIS_TYPE="pre-market"
              ENDPOINT="/api/v1/jobs/trigger"
              TRIGGER_MODE="morning_prediction_alerts"
              DESCRIPTION="Pre-Market Briefing - High-confidence signals (≥70%)"
              ;;
            '0 16 * * 1-5')
              ANALYSIS_TYPE="intraday"
              ENDPOINT="/api/v1/jobs/trigger"
              TRIGGER_MODE="midday_validation_prediction"
              DESCRIPTION="Intraday Performance Check - Real-time tracking"
              ;;
            '5 20 * * 1-5')
              ANALYSIS_TYPE="end-of-day"
              ENDPOINT="/api/v1/jobs/trigger"
              TRIGGER_MODE="next_day_market_prediction"
              DESCRIPTION="End-of-Day Summary - Market close analysis"
              ;;
            '0 14 * * SUN')
              ANALYSIS_TYPE="weekly-review"
              ENDPOINT="/api/v1/jobs/trigger"
              TRIGGER_MODE="weekly_review_analysis"
              DESCRIPTION="Weekly Review - Comprehensive high-confidence signal analysis"
              ;;
            *)
              # workflow_dispatch or unknown schedule
              ANALYSIS_TYPE="manual"
              ENDPOINT="/api/v1/jobs/trigger"
              TRIGGER_MODE="morning_prediction_alerts"
              DESCRIPTION="Manual Analysis - On-demand trading analysis"
              ;;
          esac

          echo "analysis_type=$ANALYSIS_TYPE" >> $GITHUB_OUTPUT
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT
          echo "trigger_mode=$TRIGGER_MODE" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT

          echo "Analysis Type: $ANALYSIS_TYPE"
          echo "Endpoint: $ENDPOINT"
          echo "Trigger Mode: ${TRIGGER_MODE:-N/A}"
          echo "Description: $DESCRIPTION"

      - name: Execute Trading Analysis
        run: |
          ENDPOINT="${{ steps.analysis-type.outputs.endpoint }}"
          TRIGGER_MODE="${{ steps.analysis-type.outputs.trigger_mode }}"
          WORKER_URL="https://tft-trading-system.yanggf.workers.dev"
          API_KEY="${{ secrets.X_API_KEY }}"

          echo "🚀 Starting ${{ steps.analysis-type.outputs.description }}"
          echo "📍 Endpoint: $ENDPOINT"
          echo "🌐 Worker URL: $WORKER_URL"

          # Job trigger endpoint uses POST with triggerMode in body
          if [[ "$ENDPOINT" == "/api/v1/jobs/trigger" ]]; then
            echo "📋 Executing scheduled job..."
            response=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "X-API-KEY: $API_KEY" \
              -H "X-Trigger-Source: github-actions" \
              -d "{\"triggerMode\": \"$TRIGGER_MODE\"}" \
              --connect-timeout 300 \
              --max-time 600 \
              "$WORKER_URL$ENDPOINT")
          else
            # Manual analysis endpoint (GET)
            echo "📋 Executing manual analysis..."
            response=$(curl -s \
              -H "X-API-KEY: $API_KEY" \
              --connect-timeout 300 \
              --max-time 600 \
              "$WORKER_URL$ENDPOINT")
          fi

          echo "📊 Analysis Response:"
          echo "$response" | jq '.' 2>/dev/null || echo "$response"

          # Extract key metrics for logging
          success=$(echo "$response" | jq -r '.success // "unknown"')
          if [[ "$success" == "true" ]]; then
            echo "✅ Analysis completed successfully"

            # Log additional metrics if available
            if echo "$response" | jq -e '.analyzed_date' > /dev/null 2>&1; then
              analyzed_date=$(echo "$response" | jq -r '.analyzed_date')
              echo "📅 Analysis Date: $analyzed_date"
            fi

            if echo "$response" | jq -e '.summary' > /dev/null 2>&1; then
              system_status=$(echo "$response" | jq -r '.summary.system_status // "N/A"')
              echo "📈 System Status: $system_status"
            fi

          else
            echo "❌ Analysis failed"
            echo "Response: $response"
            exit 1
          fi

      # "Execute Predictive Analytics" was removed along with the predictive
      # analytics feature. It called /api/v1/predictive/signals and
      # /api/v1/predictive/insights, which answered 500 ("Failed to generate
      # predictive signals") — the step caught that, printed
      # "⚠️ Predictive signals failed (non-critical)" and set every value to
      # Unavailable, which is what the Teams card had been reporting.

      - name: Log Analysis Summary
        run: |
          echo "📋 Analysis Summary"
          echo "=================="
          echo "Timestamp: $(date -u)"
          echo "Analysis Type: ${{ steps.analysis-type.outputs.analysis_type }}"
          echo "Description: ${{ steps.analysis-type.outputs.description }}"
          echo "Endpoint: ${{ steps.analysis-type.outputs.endpoint }}"
          echo "Worker URL: https://tft-trading-system.yanggf.workers.dev"
          echo "Status: Completed successfully ✅"

      - name: Send Teams Success Notification
        if: success()
        run: |
          ENDPOINT="${{ steps.analysis-type.outputs.endpoint }}"
          WORKER_URL="https://tft-trading-system.yanggf.workers.dev"
          ANALYSIS_TYPE="${{ steps.analysis-type.outputs.analysis_type }}"

          echo "📢 Sending Teams success notification..."

          # Build the Teams message
          TEAMS_MESSAGE=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "00B294",
            "summary": "Trading Analysis Complete",
            "sections": [{
              "activityTitle": "🧠 Enhanced Trading Analysis Complete",
              "activitySubtitle": "$(date -u)",
              "activityText": "Analysis completed successfully",
              "facts": [
                {"name": "Analysis Type", "value": "${{ steps.analysis-type.outputs.description }}"},
                {"name": "Primary Report", "value": "[View Results](${WORKER_URL}${ENDPOINT})"},
                {"name": "System Status", "value": "🟢 Operational"}
              ],
              "markdown": true
            }],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "📊 View Primary Report",
                "target": ["${WORKER_URL}${ENDPOINT}"]
              },
              {
                "@type": "OpenUri",
                "name": "📈 Market Intelligence Dashboard",
                "target": ["${WORKER_URL}/api/v1/market-intelligence/dashboard"]
              }
            ]
          }
          EOF
          )

          # Send to Teams webhook
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$TEAMS_MESSAGE" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" || echo "⚠️ Teams notification failed (not critical)"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "🚨 Trading Analysis Failed!"
          echo "Analysis Type: ${{ steps.analysis-type.outputs.analysis_type }}"
          echo "Timestamp: $(date -u)"
          echo "Please check the worker logs and system status."

          # Send Teams error notification
          TEAMS_ERROR_MESSAGE=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "FF0000",
            "summary": "Trading Analysis Failed",
            "sections": [{
              "activityTitle": "🚨 Trading Analysis Failed",
              "activitySubtitle": "$(date -u)",
              "activityText": "Analysis execution failed",
              "facts": [
                {"name": "Analysis Type", "value": "${{ steps.analysis-type.outputs.description }}"},
                {"name": "System Status", "value": "🔴 Error"},
                {"name": "Time", "value": "$(date -u)"}
              ],
              "markdown": true
            }]
          }
          EOF
          )

          # Send error to Teams
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$TEAMS_ERROR_MESSAGE" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" || echo "⚠️ Teams error notification failed"

  # Health check job
  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    needs: trading-analysis

    steps:
      - name: Execute Health Check
        run: |
          WORKER_URL="https://tft-trading-system.yanggf.workers.dev"
          API_KEY="${{ secrets.X_API_KEY }}"

          echo "🏥 Running System Health Check"

          # Check overall system health
          health_response=$(curl -s -H "X-API-KEY: $API_KEY" "$WORKER_URL/health")
          echo "System Health: $health_response"

          # Check model health
          model_health_response=$(curl -s "$WORKER_URL/model-health")
          echo "Model Health: $model_health_response"

          # Check market intelligence health
          market_intel_response=$(curl -s -H "X-API-KEY: $API_KEY" "$WORKER_URL/api/v1/market-intelligence/dashboard" | head -c 500)
          echo "Market Intelligence Status: Available"

          # Log comprehensive health status
          system_status=$(echo "$health_response" | jq -r '.status // "unknown"')

          echo "🏥 Health Check Summary:"
          echo "  - Core System: $system_status"
          echo "  - Market Intelligence: Available"
          echo "  - Model Health: Checked"

          if [[ "$system_status" == "healthy" ]]; then
            echo "✅ All systems are healthy and operational"
          else
            echo "⚠️ Some systems require attention"
          fi

      - name: Check Schedule Compliance
        run: |
          WORKER_URL="https://tft-trading-system.yanggf.workers.dev"
          API_KEY="${{ secrets.X_API_KEY }}"
          TODAY=$(date -u +%Y-%m-%d)
          ANALYSIS_TYPE="${{ needs.trading-analysis.outputs.analysis_type }}"

          echo "🕐 Checking scheduled run compliance for $TODAY"

          response=$(curl -s \
            -H "X-API-KEY: $API_KEY" \
            --connect-timeout 10 \
            --max-time 15 \
            "$WORKER_URL/api/v1/jobs/schedule-check?date=$TODAY")

          echo "Schedule check response:"
          echo "$response" | jq '.' 2>/dev/null || echo "$response"

          is_weekday=$(echo "$response" | jq -r '.data.isWeekday // false')
          all_present=$(echo "$response" | jq -r '.data.allPresent // false')
          missing=$(echo "$response" | jq -r '.data.missingReports // [] | join(", ")')

          if [[ "$is_weekday" != "true" ]]; then
            echo "📅 Weekend - no scheduled runs expected"
          elif [[ "$all_present" == "true" ]]; then
            echo "✅ All expected scheduled runs completed for $TODAY"
          else
            echo "⚠️ Missing scheduled runs for $TODAY: $missing"
            # Log per-check details
            echo "$response" | jq -r '.data.checks[]? | "  \(.reportType): status=\(.latestStatus // "MISSING") trigger=\(.latestTriggerSource // "none") ga_run=\(.hasGitHubActionsRun)"'
          fi

# Workflow Configuration
# ======================
# CAPABILITIES:
# - Market intelligence automation (sector rotation, market drivers)
# - Teams notifications on success and failure
# - Health monitoring for the core system
#
# The predictive-analytics capabilities that used to be listed here went with
# the feature: those endpoints answered 500, and the dashboard that was meant
# to consume them made no network calls at all.
#
# COST: 100% FREE - Unlimited GitHub Actions for public repositories
# LIMITS:
# - 3,000 minutes/month for free tier
# - 20 concurrent jobs
# - 2GB storage per workflow
#
# SECRETS REQUIRED:
# - X_API_KEY: API key for trading system authentication
# - TEAMS_WEBHOOK_URL: Microsoft Teams webhook URL for notifications (optional)
#
# NOTE: WORKER_URL is hardcoded as it's public information, not a secret
#
# MONITORING:
# - All executions logged in GitHub Actions console
# - Performance tracking and trend analysis
