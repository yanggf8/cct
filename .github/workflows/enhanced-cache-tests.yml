name: Enhanced Cache System Tests

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/modules/enhanced-*.ts'
      - 'src/routes/enhanced-*.ts'
      - 'src/modules/cache-manager.ts'
      - 'tests/integration/test-enhanced-*.sh'
      - 'tests/regression/run-regression-tests.sh'
      - 'tests/performance/test-playwright-*.sh'
      - 'tests/**/*.spec.js'
      - 'playwright.config.js'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/modules/enhanced-*.ts'
      - 'src/routes/enhanced-*.ts'
      - 'src/modules/cache-manager.ts'
      - 'tests/integration/test-enhanced-*.sh'
      - 'tests/regression/run-regression-tests.sh'
      - 'tests/performance/test-playwright-*.sh'
      - 'tests/**/*.spec.js'
      - 'playwright.config.js'
  schedule:
    # Run regression tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: false
        default: 'integration'
        type: choice
        options:
          - integration
          - regression
          - baseline
          - playwright

env:
  API_URL: 'https://tft-trading-system.yanggf.workers.dev'
  # Was the literal key. This repo is public, and the X_API_KEY secret it
  # should have been reading has existed since 2025-10-02 — three other
  # workflows already use it.
  API_KEY: ${{ secrets.X_API_KEY }}

jobs:
  test-enhanced-cache:
    name: Enhanced Cache Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl bc jq

    - name: Make test scripts executable
      run: |
        chmod +x scripts/utilities/validate-enhanced-cache.sh
        chmod +x tests/regression/run-regression-tests.sh

    - name: Wait for deployment (if needed)
      run: |
        echo "Waiting for deployment to be ready..."
        sleep 30

    - name: Check API connectivity
      run: |
        echo "Checking API connectivity..."
        for i in {1..10}; do
          if curl -s --max-time 10 "$API_URL/api/v1/data/health" | grep -q "healthy"; then
            echo "API is ready!"
            break
          fi
          echo "Attempt $i: API not ready, waiting..."
          sleep 10
        done

    - name: Run integration tests
      run: |
        echo "Running enhanced cache integration tests..."
        # The parse step below reads a log the script never wrote, which is half
        # of why this job failed 100 times. Capture it here, and keep the
        # script's exit status rather than tee's with pipefail.
        set -o pipefail
        ./scripts/utilities/validate-enhanced-cache.sh 2>&1 \
          | tee "test-results-${GITHUB_RUN_ID}.log"

    - name: Parse test results
      if: always()
      run: |
        # `[ -f test-results-*.log ]` was wrong in both directions: with no
        # match the glob stays literal and the test is false, and with more
        # than one match `[ -f a b ]` is a syntax error. The run id makes the
        # name exact, so no globbing is needed.
        LOG="test-results-${GITHUB_RUN_ID}.log"
        if [ -f "$LOG" ]; then
          echo "=== Test Results ==="
          cat "$LOG"

          # `grep -c` prints 0 AND exits 1 when nothing matches, so
          # `$(grep -c … || echo "0")` yields the two-line string "0\n0" and
          # the arithmetic below dies with "syntax error in expression". The
          # `|| true` only needs to stop `set -e` aborting; grep has already
          # printed the count. Note this broke on the happy path: zero failures
          # is exactly the case that produced the bad value.
          PASSED=$(grep -c "✅ PASS:" "$LOG" || true)
          FAILED=$(grep -c "❌ FAIL:" "$LOG" || true)
          TOTAL=$((PASSED + FAILED))

          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

          if [ $FAILED -eq 0 ]; then
            echo "ALL_TESTS_PASSED=true" >> $GITHUB_ENV
          else
            echo "ALL_TESTS_PASSED=false" >> $GITHUB_ENV
          fi
        else
          echo "No test results found"
          echo "ALL_TESTS_PASSED=false" >> $GITHUB_ENV
        fi

    - name: Generate test summary
      if: always()
      run: |
        echo "## Enhanced Cache Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Total Tests | ${{ env.TOTAL }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Passed | ${{ env.PASSED }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Failed | ${{ env.FAILED }} |" >> $GITHUB_STEP_SUMMARY
        # Computed in shell, deliberately NOT in a GitHub Actions expression:
        # that grammar has no arithmetic operators, so `PASSED * 100 / TOTAL`
        # is a syntax error and GitHub rejects the WHOLE file at load time —
        # the run then shows conclusion=failure with zero jobs and no logs.
        # PASSED/TOTAL are already exported via $GITHUB_ENV above, so they are
        # ordinary shell variables here.
        #
        # Do not write the expression delimiters in this comment to explain the
        # point. A `#` inside a `run:` block is a SHELL comment, not a YAML one,
        # and GitHub expands expressions across the whole block before bash ever
        # sees it — an empty pair of delimiters here is itself a syntax error
        # that rejects the file. That is exactly how commit 4246a0f "fixed" the
        # arithmetic and left the workflow just as broken.
        if [ "${TOTAL:-0}" -gt 0 ]; then RATE=$(( PASSED * 100 / TOTAL )); else RATE=0; fi
        echo "| Success Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
        echo "| Status | ${{ env.ALL_TESTS_PASSED == 'true' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Add detailed log if there are failures
        if [ "${{ env.ALL_TESTS_PASSED }}" = "false" ]; then
          echo "### Failed Tests Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # The redirect used to bind only to the `echo`, so on the branch that
          # matters -- there ARE failures -- grep's output went to stdout and
          # the summary got nothing. Group both sides so either lands in it.
          { grep "❌ FAIL:" "test-results-${GITHUB_RUN_ID}.log" || echo "No failed tests found"; } >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test logs
      # Disabled under the no-test-artifacts policy (validate-no-artifacts.yml
      # requires exactly this marker within 2 lines above the `uses:`).
      # REPLACES `if: always()` rather than joining it — two `if:` keys on one
      # step is a duplicate mapping key, which GitHub rejects at load time.
      # `retention-days: 0` was invalid anyway; the allowed range is 1-90.
      if: ${{ false }}
      uses: actions/upload-artifact@v4
      with:
        name: enhanced-cache-test-logs
        path: |
          test-results-*.log
          response.json

    - name: Fail on test failures
      if: env.ALL_TESTS_PASSED == 'false'
      run: |
        echo "❌ Some tests failed. Check the logs for details."
        exit 1

  regression-test:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: test-enhanced-cache
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl bc jq

    - name: Make test scripts executable
      run: |
        chmod +x tests/regression/run-regression-tests.sh

    - name: Create baseline if needed
      if: github.event.inputs.test_type == 'baseline' || ! contains(github.ref, 'refs/heads/')
      run: |
        echo "Creating baseline..."
        ./tests/regression/run-regression-tests.sh baseline "ci-$(date +%Y%m%d-%H%M%S)"

    - name: Run regression tests
      run: |
        echo "Running regression tests..."
        # Get the latest baseline
        LATEST_BASELINE=$(ls -t tests/regression/baselines/dac-service-binding-baseline-*.json 2>/dev/null | head -1 | xargs basename -s .json | sed 's/dac-service-binding-baseline-//' || echo "")

        if [ -n "$LATEST_BASELINE" ]; then
          echo "Comparing with baseline: $LATEST_BASELINE"
          ./tests/regression/run-regression-tests.sh compare "$LATEST_BASELINE"
        else
          echo "No baseline found, creating one..."
          ./tests/regression/run-regression-tests.sh baseline "ci-$(date +%Y%m%d-%H%M%S)"
        fi

    - name: Upload regression reports
      # Disabled under the no-test-artifacts policy — see the note on the
      # "Upload test logs" step above. Exactly one `if:`, and no
      # `retention-days: 0` (the allowed range is 1-90).
      if: ${{ false }}
      uses: actions/upload-artifact@v4
      with:
        name: regression-reports
        path: |
          test-reports/
          tests/integration/dac/test-reports/
          tests/regression/test-reports/
          tests/regression/baselines/

  deploy-validation:
    name: Deploy Validation
    runs-on: ubuntu-latest
    needs: test-enhanced-cache
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate enhanced cache features in production
      run: |
        echo "Validating enhanced cache features in production..."

        # These were the bare /cache-* paths, which have returned 404 since the
        # API moved under /api/v1. This job never ran to notice: the integration
        # job ahead of it failed on every one of 100 runs and this one was
        # skipped each time. The REST names come from the mapping in
        # src/routes/api-v1.ts -- note promotion/status are renamed, not just
        # re-prefixed.
        ENDPOINTS=(
          "/api/v1/cache/health"
          "/api/v1/cache/config"
          "/api/v1/cache/metrics"
          "/api/v1/cache/promote"
          "/api/v1/cache/status"
        )

        for endpoint in "${ENDPOINTS[@]}"; do
          echo "Testing $endpoint..."
          response=$(curl -s -w "%{http_code}" -o response.json \
            -H "X-API-KEY: $API_KEY" \
            "$API_URL$endpoint" \
            --max-time 10)

          if [ "$response" = "200" ]; then
            echo "✅ $endpoint - OK"
          else
            echo "❌ $endpoint - FAILED (HTTP $response)"
            if [ -f response.json ]; then
              cat response.json
            fi
            exit 1
          fi
        done

        echo "All enhanced cache features validated successfully!"

    - name: Performance validation
      run: |
        echo "Running performance validation..."

        # Test cache warmup. Informational: warmup is blocked in production
        # unless ALLOW_CACHE_WARMUP is set, so a `success: false` here is the
        # intended configuration rather than a fault.
        curl -s -X POST \
          -H "X-API-KEY: $API_KEY" \
          -H "Content-Type: application/json" \
          "$API_URL/api/v1/cache/warmup" | jq .

        # Run Playwright performance tests (if available)
        if [ -f "tests/performance/test-playwright-performance.sh" ] && [ -d "tests" ]; then
          echo "Running Playwright performance tests..."
          chmod +x tests/performance/test-playwright-performance.sh

          # Install Playwright dependencies
          npm install @playwright/test || echo "Playwright dependencies installation skipped"

          # Run performance tests
          ./tests/performance/test-playwright-performance.sh || echo "⚠️ Playwright tests completed with some issues"
        else
          echo "⚠️ Playwright tests not available - skipping"

          # Basic performance check using curl
          echo "Running basic performance validation..."

          # Test cache health endpoint response time
          start_time=$(date +%s%3N)
          health_response=$(curl -s -H "X-API-KEY: $API_KEY" "$API_URL/api/v1/cache/health")
          end_time=$(date +%s%3N)
          response_time=$((end_time - start_time))

          echo "Cache health response time: ${response_time}ms"

          if [ "$response_time" -lt 5000 ]; then
            echo "✅ Basic performance validation passed - ${response_time}ms response time"
          else
            echo "⚠️ Performance validation warning - ${response_time}ms response time (>5s)"
          fi
        fi

    - name: Health check validation
      run: |
        echo "Validating system health..."

        health_response=$(curl -s -H "X-API-KEY: $API_KEY" "$API_URL/api/v1/cache/health")
        status=$(echo "$health_response" | jq -r '.assessment.status // unknown')
        score=$(echo "$health_response" | jq -r '.assessment.overallScore // 0')

        echo "Health Status: $status"
        echo "Health Score: $score/100"

        if [ "$status" = "healthy" ] || [ "$status" = "degraded" ]; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed - status: $status"
          exit 1
        fi