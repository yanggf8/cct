name: Build-Time Mock Prevention (Sprint 1-C)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - strict

jobs:
  mock-prevention:
    name: Build-Time Mock Prevention
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g wrangler

      - name: Mock Data Detection - Strict Scan
        # Delegates to the script `npm run test:mock-prevention` already runs,
        # instead of keeping a second copy of the pattern table inline. The copy
        # that lived here had drifted badly:
        #   * it searched with `rg -i` / `grep -rinE`, so every upper/lower
        #     pattern pair matched the same lines and was counted twice — the
        #     "12 violations" it reported were 6 real classes;
        #   * it had no severity tiers, so `placeholder` blocked the build as
        #     hard as `COMING SOON`;
        #   * it never implemented the `// MOCK-EXEMPTION: JIRA-123` escape
        #     hatch that its own failure message tells you to use;
        #   * it scanned `dist`, which does not exist in this job — there is no
        #     build step before it, so that branch never ran.
        # `full` runs every tier and fails only on critical violations; `strict`
        # is available if warnings should block too.
        run: ./tests/feature/mock-elimination/test-mock-prevention-scan.sh full

      # "ESLint Mock Data Rules" was removed. Not one of its 22 rules had
      # anything to do with mock data -- they were no-eval, no-debugger, yoda,
      # radix and similar generic style rules; the only occurrences of "mock"
      # in the step were its own filename and a comment. Mock detection is
      # owned by test-mock-prevention-scan.sh.
      #
      # It could not have run in any case. It wrote a config extending
      # ./.eslintrc.js, a file this repo does not contain, then invoked eslint 9
      # with --ext and an .eslintrc config -- a flag that was removed and a
      # format that is no longer read by default. `npm run lint` fails locally
      # for the same reason, so the whole eslint setup goes with it.

      - name: Build Verification Scan
        run: |
          echo "🔨 Running build verification scan..."

          # Build the project first
          npm run build || {
            echo "❌ BUILD FAILED"
            exit 1
          }

          echo "✅ Build completed successfully"

          # Scan built artifacts
          if [[ -d "dist" ]]; then
            echo ""
            echo "📦 Scanning built artifacts..."

            # Look for development/debug code in production build
            DEBUG_PATTERNS=(
              "console\.log"
              "console\.warn"
              "console\.error"
              "debugger"
              "DEBUG"
              "DEVELOPMENT"
              "test"
              "TEST"
            )

            BUILD_VIOLATIONS=0

            for pattern in "${DEBUG_PATTERNS[@]}"; do
              if command -v rg >/dev/null 2>&1; then
                MATCHES=$(rg "$pattern" dist -n 2>/dev/null || true)
              else
                MATCHES=$(grep -rn "$pattern" dist 2>/dev/null || true)
              fi

              if [[ -n "$MATCHES" ]]; then
                echo "⚠️ Debug code found in production build: $pattern"
                echo "$MATCHES"
                echo ""
                BUILD_VIOLATIONS=$((BUILD_VIOLATIONS + 1))
              fi
            done

            # Check file sizes (no bloated bundles)
            echo ""
            echo "📏 Checking bundle sizes..."
            find dist -name "*.js" -exec ls -lh {} \; | while read -r line; do
              SIZE=$(echo "$line" | awk '{print $5}')
              FILE=$(echo "$line" | awk '{print $9}')

              # Convert size to KB for comparison (skip if less than 1KB)
              if [[ "$SIZE" == *K* ]]; then
                SIZE_KB=${SIZE%K}
                if (( $(echo "$SIZE_KB > 500" | bc -l) )); then
                  echo "⚠️ Large bundle detected: $FILE ($SIZE)"
                fi
              elif [[ "$SIZE" == *M* ]]; then
                echo "❌ Very large bundle detected: $FILE ($SIZE)"
                BUILD_VIOLATIONS=$((BUILD_VIOLATIONS + 1))
              fi
            done

            if [[ $BUILD_VIOLATIONS -gt 0 ]]; then
              echo ""
              echo "❌ BUILD VERIFICATION FAILED"
              echo "Found $BUILD_VIOLATIONS violations in built artifacts"
              exit 1
            else
              echo ""
              echo "✅ BUILD VERIFICATION PASSED"
              echo "No debug code or issues found in production artifacts"
            fi
          else
            echo "⚠️ No dist directory found - skipping build artifact scan"
          fi

      - name: Deterministic Build Verification
        run: |
          echo "🔐 Running deterministic build verification..."

          # Build twice and compare
          npm run build
          BUILD1_HASH=$(find dist -type f -exec sha256sum {} \; | sort | sha256sum || echo "no_build_files")

          # Clean and rebuild
          rm -rf dist
          npm run build
          BUILD2_HASH=$(find dist -type f -exec sha256sum {} \; | sort | sha256sum || echo "no_build_files")

          if [[ "$BUILD1_HASH" == "$BUILD2_HASH" ]]; then
            echo "✅ Deterministic build verification passed"
            echo "Build hash: $BUILD1_HASH"
          else
            echo "❌ DETERMINISTIC BUILD FAILED"
            echo "Build hashes differ between runs - non-deterministic build detected"
            echo "Build 1: $BUILD1_HASH"
            echo "Build 2: $BUILD2_HASH"
            exit 1
          fi

      - name: Bundle Analysis
        run: |
          echo "📊 Running bundle analysis..."

          if [[ -f "package.json" ]] && [[ -d "dist" ]]; then
            # Analyze bundle composition
            echo "Bundle composition:"
            find dist -name "*.js" -exec wc -l {} \; | while read -r lines file; do
              echo "  $file: $lines lines"
            done

            # Check for external dependencies that should be bundled
            if [[ -f "package-lock.json" ]]; then
              echo ""
              echo "External dependencies analysis:"
              # Look for common CDN dependencies that might indicate missing bundling
              if grep -r "cdn\.jsdelivr\|unpkg\|cdnjs\.cloudflare" dist/ >/dev/null 2>&1; then
                echo "⚠️ External CDN dependencies found in production build"
              fi
            fi

            echo "✅ Bundle analysis completed"
          fi

  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks
        # The previous `npm install -g gitleaks` installed a package that ships
        # no working binary, so every run of the step below died on
        # "gitleaks: command not found" — the gate had never once executed.
        # `go install` at a pinned version resolves through the Go module proxy
        # with checksum verification (same pattern as the actionlint gate).
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run npm audit (production dependencies)
        run: |
          echo "🔒 Auditing production dependencies..."

          # Blocking, and scoped to what can actually ship. The previous version
          # audited the whole tree at --audit-level high, and its message said
          # "High/medium" while the flag only covers high and above.
          #
          # The whole tree is 15 findings, 11 of them high, and essentially all
          # of them arrive through
          #     wrangler (devDependency) -> miniflare -> undici, ws
          # which never reaches the Worker. Blocking releases on a local dev
          # tool's transitive dependencies is how a gate teaches people to
          # ignore it.
          npm audit --omit=dev --audit-level high || {
            echo ""
            echo "❌ NPM AUDIT FAILED (production dependencies)"
            echo "These can ship. Update or remove the owning dependency."
            exit 1
          }
          echo "✅ Production dependency audit passed"

      - name: Run npm audit (full tree, informational)
        if: always()
        run: |
          echo "🔎 Auditing the full dependency tree — informational, does not fail the build."
          echo "   Findings here are dev/build tooling. Track them, do not gate on them."
          echo ""
          npm audit || true

      - name: Run Gitleaks
        run: |
          echo "🕵️ Running Gitleaks secret scanning..."

          # --no-git scans the checked-out tree instead of all 706 commits.
          # That is deliberate: this gate exists to stop NEW secrets landing,
          # and a new secret is by definition present in the tree. Scanning
          # history instead would fail every run on credentials leaked in 2025,
          # which no code change can remove — those are handled by rotation and
          # tracked in .gitleaksignore, not by turning this gate permanently red.
          #
          # --redact keeps matched values out of the public build log.
          gitleaks detect --no-git --config .gitleaks.toml --verbose --redact || {
            echo ""
            echo "❌ GITLEAKS FAILED"
            echo "A secret was found in the working tree. Do not just delete the"
            echo "line: assume the value is compromised and rotate it at the"
            echo "provider first. If it is a placeholder, add it to the allowlist"
            echo "in .gitleaks.toml with a comment saying why it is not real."
            exit 1
          }
          echo "✅ Gitleaks scan passed"

      - name: Dependency Policy Check
        run: |
          echo "📦 Checking dependency policy..."

          # Check for overly permissive version ranges
          if grep -E '"[^"]": "\^[0-9]\.[0-9]\.[0-9]+"' package.json >/dev/null 2>&1; then
            echo "⚠️ Some dependencies use caret ranges - consider pinning for production"
          fi

          # Check for security-relevant dependencies
          SECURITY_DEPS=(
            "express"
            "axios"
            "lodash"
            "request"
            "node-fetch"
          )

          for dep in "${SECURITY_DEPS[@]}"; do
            if grep -q "\"$dep\"" package.json; then
              echo "🔍 Checking security status of $dep..."
              npm audit --json | jq -r ".advisories[] | select(.module_name == \"$dep\") | .severity" | head -1
            fi
          done

          echo "✅ Dependency policy check completed"

  reproducible-builds:
    name: Reproducible Builds Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Node 18
        run: |
          echo "🔄 Verifying build reproducibility across Node versions..."
          npm run build
          HASH=$(find dist -type f -exec sha256sum {} \; | sort | sha256sum | awk '{print $1}')
          echo "Node 18 build hash: ${HASH:-no_files}"
          echo "BUILD_18_HASH=${HASH:-no_files}" >> $GITHUB_ENV
          rm -rf dist node_modules/.cache

      - name: Switch to Node 20
        # Replaces `curl … nodesource | bash -` followed by
        # `apt-get install -y nodejs`, which cannot work here: the job runs as
        # the unprivileged `runner` user, so apt fails to take
        # /var/lib/dpkg/lock-frontend and the step dies with exit 100 — every
        # run, right after the Node 18 build had already succeeded.
        # setup-node is simply invoked a second time to swap the toolchain.
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Build with Node 20 and compare
        run: |
          npm ci
          npm run build
          HASH=$(find dist -type f -exec sha256sum {} \; | sort | sha256sum | awk '{print $1}')
          BUILD_20_HASH=${HASH:-no_files}
          echo "Node 18 build hash: $BUILD_18_HASH"
          echo "Node 20 build hash: $BUILD_20_HASH"

          if [[ "$BUILD_18_HASH" == "$BUILD_20_HASH" ]]; then
            echo "✅ Builds are reproducible across Node versions"
          else
            echo "⚠️ Build hashes differ across Node versions"
            echo "This may indicate environment-specific build behavior"
          fi