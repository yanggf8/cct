name: Validate No Test Artifacts Policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - 'test-*.sh'
      - 'src/**'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/*.yml'
      - 'test-*.sh'

jobs:
  validate-no-artifacts:
    name: Validate No Test Artifacts Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check Workflows for Artifact Uploads
      # Was an inline grep that could not do the job:
      #   * one `grep -A 5 -B 2` per FILE, so a disabled upload masked an
      #     active one in the same workflow;
      #   * any line containing the marker satisfied it, including a comment;
      #   * its own pattern was an escaped expression inside `run:`, so GitHub
      #     expanded it first and the check actually searched for `if: \false`
      #     — matching nothing, which is why every file with an upload was
      #     reported as a violation and this workflow failed every run.
      # The replacement parses the YAML and inspects each step's own `if:`.
      run: node tests/validation/validate-no-artifacts.mjs

    - name: Check Test Scripts for Persistent Files
      # Was an inline grep for `cat > *.json` on lines not mentioning TMPDIR,
      # which got it wrong both ways: it flagged scripts that DO scope their
      # writes (the working directory is what makes them safe, not the text of
      # the line) and it missed `cat > "$REPORT_FILE"` entirely, so three
      # scripts writing reports into the checkout were never reported.
      #
      # Detecting writes textually needs a shell parser — two regex attempts
      # flagged 36 and then 18 of 51 scripts, nearly all on `>` inside quoted
      # strings. The replacement checks the contract the policy states instead:
      # a run-scoped temp directory removed on EXIT.
      run: node tests/validation/validate-no-persistent-files.mjs

    - name: Test Script Execution - No Artifacts
      run: |
        echo "🧪 Testing script execution without creating artifacts..."

        # Create test environment
        export GITHUB_RUN_ID="test-validation-$$"
        export CCT_URL="https://example.com"
        export X_API_KEY="test-key"

        TESTED_SCRIPTS=0
        ARTIFACT_FREE=0

        # Test a few scripts to ensure they don't leave artifacts
        for script in test-slo-breach-simulation.sh test-admin-apis-negative.sh; do
          if [[ -f "$script" ]]; then
            echo "Testing $script (dry run)..."

            # Count files before
            FILES_BEFORE=$(find . -maxdepth 1 -name "*.json" -o -name "*.log" -o -name "*.tmp" | wc -l)

            # Run script with minimal parameters to test cleanup
            if timeout 30 bash "$script" --help 2>/dev/null || true; then
              echo "  ✅ Script executed without errors"
            else
              echo "  ⚠️  Script may not support --help, but that's okay"
            fi

            # Count files after
            FILES_AFTER=$(find . -maxdepth 1 -name "*.json" -o -name "*.log" -o -name "*.tmp" | wc -l)

            if [[ $FILES_AFTER -eq $FILES_BEFORE ]]; then
              echo "  ✅ No artifacts created during execution"
              ARTIFACT_FREE=$((ARTIFACT_FREE + 1))
            else
              echo "  ❌ Artifacts may have been created"
              find . -maxdepth 1 -name "*.json" -o -name "*.log" -o -name "*.tmp" -newer "$script" 2>/dev/null || true
            fi

            TESTED_SCRIPTS=$((TESTED_SCRIPTS + 1))
            echo ""
          fi
        done

        echo "📊 Script Execution Results:"
        echo "  Scripts tested: $TESTED_SCRIPTS"
        echo "  Artifact-free executions: $ARTIFACT_FREE"

        if [[ $TESTED_SCRIPTS -gt 0 ]] && [[ $ARTIFACT_FREE -eq $TESTED_SCRIPTS ]]; then
          echo "✅ All tested scripts execute without creating artifacts"
        else
          echo "⚠️  Some scripts may create artifacts (check logs above)"
        fi

    - name: Validate Clean Environment
      run: |
        echo "🧹 Validating clean test environment..."

        # Check for any leftover artifacts from this workflow run
        ARTIFACTS=$(find . -maxdepth 1 -name "*test*" -o -name "*chaos*" -o -name "*slo*" -o -name "*validation*" | grep -E "\.(json|log|tmp|report)$" || true)

        if [[ -n "$ARTIFACTS" ]]; then
          echo "❌ Found leftover artifacts:"
          echo "$ARTIFACTS"
          echo ""
          echo "This indicates scripts are not cleaning up properly"
          exit 1
        else
          echo "✅ Environment is clean - no leftover artifacts"
        fi

        # Check for temporary directories
        TEMP_DIRS=$(find . -name ".ci-tmp" -type d 2>/dev/null || true)
        if [[ -n "$TEMP_DIRS" ]]; then
          echo "⚠️  Found temporary directories (should be cleaned by trap):"
          echo "$TEMP_DIRS"
        else
          echo "✅ No leftover temporary directories"
        fi

    - name: Create Validation Report
      if: always()
      run: |
        echo ""
        echo "📋 No-Artifacts Policy Validation Report"
        echo "======================================"
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "Repository: ${{ github.repository }}"
        echo "Commit: ${{ github.sha }}"
        echo ""

        echo "✅ Policy Compliance Validated:"
        echo "  • Workflows: No active artifact uploads for tests"
        echo "  • Scripts: All use temporary directory patterns"
        echo "  • Execution: No artifacts left behind"
        echo "  • Environment: Clean after test execution"
        echo ""

        echo "🎯 Production Impact:"
        echo "  • Zero storage costs for test artifacts"
        echo "  • No risk of sensitive test data exposure"
        echo "  • Clean repository structure"
        echo "  • Consistent test behavior across environments"
        echo ""

        echo "📝 Policy Summary:"
        echo "  • All test artifacts are temporary and auto-cleaned"
        echo "  • Reports and metrics go to logs/annotations only"
        echo "  • No persistent test files in repository"
        echo "  • Artifact cleanup workflow serves as safety net"